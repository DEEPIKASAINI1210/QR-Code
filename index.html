
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code Generator</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        .app {
            background: white;
            width: 100%;
            max-width: 420px;
            padding: 30px 24px;
            border-radius: 22px;
            text-align: center;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
        }

        h1 {
            color: #252b48;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #777;
            font-size: 14px;
            margin-bottom: 25px;
        }

        textarea {
            width: 100%;
            height: 110px;
            padding: 14px;
            border: 2px solid #e1e5f2;
            border-radius: 12px;
            font-size: 16px;
            resize: vertical;
            outline: none;
        }

        textarea:focus {
            border-color: #667eea;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 15px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .generate {
            background: #667eea;
            color: white;
        }

        .generate:hover {
            background: #5365d8;
        }

        .download {
            background: #18a875;
            color: white;
            display: none;
        }

        .download:hover {
            background: #12885f;
        }

        #qr-container {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 25px;
            overflow: auto;
        }

        #qr-container canvas,
        #qr-container img {
            max-width: 100%;
            height: auto;
        }

        #message {
            color: #d93025;
            font-size: 14px;
            margin-top: 12px;
        }

        .footer {
            color: #999;
            font-size: 12px;
            margin-top: 25px;
        }
    </style>
</head>

<body>
    <main class="app">
        <h1>📱 QR Code Generator</h1>
        <p class="subtitle">
            Turn your text or website URL into a QR code.
        </p>

        <textarea
            id="data"
            placeholder="Enter text or URL here..."
        ></textarea>

        <button class="generate" onclick="generateQR()">
            Generate QR Code
        </button>

        <p id="message" role="status"></p>

        <div id="qr-container"></div>

        <button
            id="download"
            class="download"
            onclick="downloadQR()"
        >
            ⬇ Download QR Code
        </button>

        <p class="footer">Simple • Fast • Free</p>
    </main>

    <script>
        const input = document.getElementById("data");
        const container = document.getElementById("qr-container");
        const downloadButton = document.getElementById("download");
        const message = document.getElementById("message");

        function generateQR() {
            const data = input.value.trim();

            message.textContent = "";
            container.replaceChildren();
            downloadButton.style.display = "none";

            if (!data) {
                message.textContent = "Please enter some text or a URL.";
                input.focus();
                return;
            }

            if (typeof QRCode === "undefined") {
                message.textContent =
                    "QR library failed to load. Check your internet connection.";
                return;
            }

            try {
                new QRCode(container, {
                    text: data,
                    width: 240,
                    height: 240,
                    colorDark: "#111111",
                    colorLight: "#ffffff",
                    correctLevel: QRCode.CorrectLevel.H
                });

                downloadButton.style.display = "block";
            } catch (error) {
                message.textContent =
                    "Could not generate the QR code. Try shorter text.";
            }
        }

        function downloadQR() {
            const canvas = container.querySelector("canvas");
            const image = container.querySelector("img");
            let imageURL = "";

            if (canvas) {
                imageURL = canvas.toDataURL("image/png");
            } else if (image && image.src) {
                imageURL = image.src;
            }

            if (!imageURL) {
                message.textContent = "Generate a QR code first.";
                return;
            }

            const link = document.createElement("a");
            link.href = imageURL;
            link.download = "my_qrcode.png";
            document.body.appendChild(link);
            link.click();
            link.remove();
        }
    </script>
</body>
</html>
